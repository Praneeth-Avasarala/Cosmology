      }

      function restoreNavigationVisibility() {
        const hasLocalState = Object.prototype.hasOwnProperty.call(navigationPageStates, navigationPageId);
        applyNavigationVisibility(hasLocalState ? navigationPageStates[navigationPageId] === true : false);
      }

      function closeNavigation() {
        if (!contentsOverlay || contentsOverlay.hidden) return;
        navigationPageStates[navigationPageId] = false;
        applyNavigationVisibility(false);
        writeNavigationState();
        navigationButton.focus({ preventScroll: true });
      }

      navigationButton.addEventListener("click", () => {
        const open = contentsOverlay.hidden;
        navigationPageStates[navigationPageId] = open;
        applyNavigationVisibility(open);
        writeNavigationState();
        if (open && contentsCloseButton) contentsCloseButton.focus({ preventScroll: true });
      });
      if (contentsCloseButton) contentsCloseButton.addEventListener("click", closeNavigation);
      if (contentsOverlay) {
        contentsOverlay.addEventListener("click", (event) => {
          if (event.target === contentsOverlay) closeNavigation();
        });
      }
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && contentsOverlay && !contentsOverlay.hidden) closeNavigation();
      });

      readNavigationState();
      writeNavigationState();
      restoreNavigationVisibility();
      window.addEventListener("pageshow", () => {
        readNavigationState();
        writeNavigationState();
        restoreNavigationVisibility();
      });

      const params = new URLSearchParams(window.location.search);
      const query = (params.get("q") || "").trim();
      const navigation = params.get("navigation");
      const navigationPages = params.get("navigationPages");
      if (navigation === "open" || navigation === "closed") {
        document.querySelectorAll('a[href]').forEach((link) => {
          const href = link.getAttribute("href") || "";
          if (!href || href.startsWith("#")) return;
          try {
            const url = new URL(href, window.location.href);
            const isLocalTarget = url.protocol === window.location.protocol
              && (url.protocol === "file:" || url.origin === window.location.origin);
            if (!isLocalTarget) return;
            if (!url.pathname.toLowerCase().endsWith(".html")) return;
            url.searchParams.set("navigation", navigation);
            if (navigationPages) url.searchParams.set("navigationPages", navigationPages);
            link.setAttribute("href", url.href);
          } catch {
            // Leave malformed or unsupported links unchanged.
          }
        });
      }
      const root = document.querySelector(".md-page");
      if (!root) return;

      function decodeHashComponent(value) {
        try {
          return decodeURIComponent(value);
        } catch {
          return value;
        }
      }

      const hashTargetId = decodeHashComponent(String(window.location.hash || "").replace(/^#/, ""));
      if (hashTargetId) {
        const target = document.getElementById(hashTargetId);
        if (target) {
          const highlightTarget = target.closest("details.heading-section") || target;
          highlightTarget.classList.add("target-highlight");
          let parent = target.parentElement;
          while (parent) {
            if (parent.tagName === "DETAILS") parent.open = true;
            parent = parent.parentElement;
          }
        }
      }

      if (!query) return;

      const pattern = new RegExp(query.replace(/[.*+?^()|[\]{}$\\]/g, "\\$&"), "ig");
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const parent = node.parentElement;
          if (!parent) return NodeFilter.FILTER_REJECT;
          if (["SCRIPT", "STYLE"].includes(parent.tagName)) return NodeFilter.FILTER_REJECT;
          if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          if (!pattern.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
          pattern.lastIndex = 0;
          return NodeFilter.FILTER_ACCEPT;
        },
      });

      const matches = [];
      let current = walker.nextNode();
      while (current) {
        matches.push(current);
        current = walker.nextNode();
      }

      for (const textNode of matches) {
        const text = textNode.nodeValue || "";
        pattern.lastIndex = 0;
        const fragment = document.createDocumentFragment();
        let lastIndex = 0;
        let match = pattern.exec(text);

        while (match) {
          if (match.index > lastIndex) {
            fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
          }
          const mark = document.createElement("mark");
          mark.className = "search-highlight";
          mark.textContent = match[0];
          fragment.appendChild(mark);
          lastIndex = match.index + match[0].length;
          match = pattern.exec(text);
        }

        if (lastIndex < text.length) {
          fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
        }

        textNode.parentNode.replaceChild(fragment, textNode);
      }
    })();
  </script>
</body>
</html>
